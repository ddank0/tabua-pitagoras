<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="metaThemeColor" content="#f7efe4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tábua Pitágoras">
  <title>Tábua de Pitágoras Deslizante</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/board.css">
</head>
<body>
  <main class="app-shell">
    <section id="instrumentCasing" class="instrument-casing theme-light" aria-label="Tábua de Pitágoras Deslizante">
      <header class="top-header-bar">
        <div class="top-module" aria-live="polite">
          <span id="dispRow" class="factor-y num-slot">7</span>
          <span class="op-sym">×</span>
          <span id="dispCol" class="factor-x num-slot">8</span>
          <span class="op-sym">=</span>
          <span id="dispResult" class="product-val">56</span>
        </div>

        <div class="toolbar-actions">
          <button id="btnQuizMode" type="button" class="btn-challenge" title="Iniciar Desafio Rápido">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <span id="quizBtnLabel">Desafio</span>
          </button>

          <button id="btnSound" type="button" class="icon-square-btn" title="Ativar ou desativar cliques mecânicos" aria-label="Alternar som">
            <svg id="iconSoundOn" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            </svg>
            <svg id="iconSoundOff" class="icon-muted is-hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
            </svg>
          </button>

          <button id="btnTheme" type="button" class="icon-square-btn" title="Alternar entre Estilo Madeira e Grafite Noturno" aria-label="Alternar tema">
            <svg id="iconSun" class="icon-sun is-hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>
        </div>
      </header>

      <aside id="quizBanner" class="quiz-banner is-hidden" aria-live="polite">
        <div class="quiz-top-row">
          <div class="quiz-mission-group">
            <span class="quiz-badge">Missão</span>
            <span id="quizPromptText" class="quiz-prompt">Deslize até encontrar 42!</span>
          </div>
          <div class="quiz-score-group">
            <span class="quiz-score-pill">Pontos: <strong id="quizScore">0</strong></span>
            <button id="btnSkipQuiz" type="button" class="quiz-skip-btn">Pular</button>
          </div>
        </div>
        <div class="quiz-bottom-row">
          <p id="quizFeedback" class="quiz-feedback">Deslize as réguas até o cruzamento correto e clique em Verificar.</p>
          <button id="btnCheckQuiz" type="button" class="quiz-check-btn">Verificar Posição</button>
        </div>
      </aside>

      <div id="boardWell" class="board-well" role="grid" aria-label="Matriz de multiplicação 10 por 10">
        <div id="rulerHorizontal" class="ruler-h"></div>
        <div id="rulerVertical" class="ruler-v"></div>
      </div>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
